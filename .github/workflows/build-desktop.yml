name: Build Desktop

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      runtime-target:
        required: true
        type: string
      release-tag-prefix:
        required: true
        type: string
      dsh-java-ref:
        required: false
        type: string
        default: main

jobs:
  build:
    name: ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Checkout dsh-java backend
        uses: actions/checkout@v5
        with:
          repository: linlannet/dsh-java
          ref: ${{ inputs.dsh-java-ref }}
          path: dsh-java
          token: ${{ secrets.DSH_JAVA_TOKEN != '' && secrets.DSH_JAVA_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Java and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - name: Install Linux build dependencies
        if: inputs.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Setup macOS signing and notarization
        if: inputs.platform == 'macos'
        run: |
          set -euo pipefail
          # 未配置 Apple 证书时跳过签名，产出未签名 dmg（用户打开会有 Gatekeeper 提示）
          if [ -z "${{ secrets.APPLE_CERTIFICATE }}" ] || [ -z "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "::warning::APPLE_CERTIFICATE 或 APPLE_SIGNING_IDENTITY 未配置，跳过 macOS 代码签名与公证（将产出未签名 dmg）"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          (echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 --decode > certificate.p12) || (echo "${{ secrets.APPLE_CERTIFICATE }}" | base64 -D > certificate.p12)
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq "${{ secrets.APPLE_SIGNING_IDENTITY }}" || (echo "::error::APPLE_SIGNING_IDENTITY 在导入的钥匙串中未找到，请核对。" && exit 1)

      - name: Build and bundle agent (jar + JRE runtime)
        env:
          DSH_JAVA_DIR: dsh-java
          DSH_JRE_TARGET: ${{ inputs.runtime-target }}
        run: npm run agent:prepare

      - name: Verify bundled agent JAR
        run: npm run agent:verify

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release-tag-prefix }}__VERSION__
          releaseName: 'DSH Java Desktop v__VERSION__'
          releaseBody: 'This release bundles the DeepSeek Harness Java runtime and updater artifacts.'
          releaseDraft: false
          prerelease: false
          args: '--target ${{ inputs.target }} --verbose'
